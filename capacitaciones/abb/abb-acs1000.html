<style>
  :root{
    --bg: #10141c;
    --panel: #171d2a;
    --panel-raised: #1f2738;
    --line: #2b3448;
    --text: #e8ecf3;
    --text-dim: #8b93a7;
    --amber: #7ec13f;
    --amber-dim: #3a5323;
    --teal: #6f93d6;
    --teal-dim: #223257;
    --red: #e2593c;
    --green: #5fbf73;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  ::selection{background:var(--amber-dim);color:var(--text);}

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes slideInLeft{ from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);} }
  @keyframes logoIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s cubic-bezier(.2,.7,.3,1), transform .6s cubic-bezier(.2,.7,.3,1);}
  .reveal.in{opacity:1; transform:translateY(0);}

  /* ---------- Layout ---------- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:280px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:4px 8px 20px 8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .brand-logo{font-family:var(--mono); font-weight:800; font-size:15px; letter-spacing:.04em; color:var(--sky); margin:0 0 14px 0; animation:logoIn .8s cubic-bezier(.2,.8,.3,1);}
  .brand .tag{font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--amber); text-transform:uppercase;}
  .brand h1{font-size:19px; margin:6px 0 2px 0; line-height:1.25;}
  .brand p{font-size:12px; color:var(--text-dim); margin:0;}

  .navlist{list-style:none; margin:0; padding:0;}
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:6px; cursor:pointer;
    margin-bottom:2px; border:1px solid transparent;
  }
  .navitem{transition:background .2s ease, transform .2s ease;}
  .navitem:hover{background:var(--panel-raised); transform:translateX(2px);}
  .navitem.active{background:var(--panel-raised); border-color:var(--line);}
  .led{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
    background:#3a4048; box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .led.done{background:var(--green); box-shadow:0 0 6px rgba(111,191,115,.7);}
  .led.partial{background:var(--amber); box-shadow:0 0 6px rgba(242,169,60,.6);}
  .navitem .num{font-family:var(--mono); font-size:11px; color:var(--text-dim); width:16px;}
  .navitem .label{font-size:13.5px;}
  .navitem.active .label{color:var(--amber);}

  .sidebar-foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11px; color:var(--text-dim);}

  .main{flex:1; padding:36px 44px; max-width:920px; animation:fadeIn .5s ease;}
  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line);}
    .main{padding:24px;}
  }

  /* ---------- Header ---------- */
  .modhead{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:8px;}
  .modhead .eyebrow{font-family:var(--mono); font-size:11.5px; color:var(--teal); letter-spacing:.1em; text-transform:uppercase; margin:0 0 6px 0;}
  .modhead h2{font-size:28px; margin:0 0 6px 0; line-height:1.2;}
  .modhead .sub{color:var(--text-dim); font-size:14.5px; max-width:60ch; margin:0;}

  .tabs{display:flex; gap:6px; margin:22px 0 24px 0; border-bottom:1px solid var(--line);}
  .tab{
    font-family:var(--mono); font-size:12.5px; letter-spacing:.03em;
    padding:9px 14px; cursor:pointer; color:var(--text-dim);
    border-bottom:2px solid transparent; text-transform:uppercase;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}

  /* ---------- Learn view ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:20px 22px; margin-bottom:14px;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--teal);}
  .card h3{margin:0 0 10px 0; font-size:15.5px; color:var(--teal);}
  .card p{margin:0 0 10px 0; font-size:14.5px; line-height:1.65; color:var(--text);}
  .card p:last-child{margin-bottom:0;}
  .card ul{margin:8px 0 0 0; padding-left:18px;}
  .card li{font-size:14px; line-height:1.7; margin-bottom:4px;}
  .card .note{
    margin-top:12px; padding:10px 12px; background:rgba(242,169,60,.08);
    border-left:2px solid var(--amber); font-size:13px; color:var(--text-dim); border-radius:0 4px 4px 0;
  }

  /* ---------- Accordion (details/summary) ---------- */
  details.acc{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    margin-bottom:10px; overflow:hidden;
  }
  details.acc summary{
    list-style:none; cursor:pointer; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:14px; font-weight:600; color:var(--text);
  }
  details.acc summary::-webkit-details-marker{display:none;}
  details.acc summary .chev{
    font-family:var(--mono); font-size:12px; color:var(--amber);
    transition:transform .2s; flex-shrink:0;
  }
  details.acc[open] summary .chev{transform:rotate(90deg);}
  details.acc summary:hover{background:var(--panel-raised);}
  details.acc{transition:border-color .2s ease;}
  details.acc:hover{border-color:var(--teal);}
  details.acc .accbody{padding:2px 20px 18px 20px;}
  details.acc .accbody p{font-size:14px; line-height:1.65; margin:0 0 10px 0;}
  details.acc .accbody p:last-child{margin-bottom:0;}
  details.acc .accbody ul{margin:6px 0 0 0; padding-left:18px;}
  details.acc .accbody li{font-size:13.5px; line-height:1.7; margin-bottom:4px;}

  .spectable{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12.5px; margin-top:4px;}
  .spectable td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  .spectable td:first-child{color:var(--text-dim); width:46%;}
  .spectable td:last-child{color:var(--amber);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}

  /* ---------- Quiz ---------- */
  .qcounter{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:10px;}
  .qcard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px;}
  .qtext{font-size:16px; margin:0 0 18px 0; line-height:1.5;}
  .opt{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; border:1px solid var(--line); border-radius:6px;
    margin-bottom:9px; cursor:pointer; font-size:14px; background:var(--panel-raised);
    transition:border-color .15s;
  }
  .opt{transition:transform .15s ease, border-color .15s ease;}
  .opt:hover{border-color:var(--teal); transform:translateX(3px);}
  .opt.selected{border-color:var(--teal);}
  .opt.correct{border-color:var(--green); background:rgba(111,191,115,.1);}
  .opt.wrong{border-color:var(--red); background:rgba(226,89,60,.1);}
  .opt .bullet{
    width:18px; height:18px; border-radius:50%; border:1px solid var(--text-dim);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:10px; color:var(--text-dim);
  }
  .opt.correct .bullet{border-color:var(--green); color:var(--green);}
  .opt.wrong .bullet{border-color:var(--red); color:var(--red);}

  .explain{
    margin-top:14px; padding:12px 14px; border-radius:6px; font-size:13.5px; line-height:1.55;
    background:var(--panel-raised); border:1px solid var(--line); display:none;
  }
  .explain.show{display:block;}

  .qnav{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
  .btn{
    font-family:var(--mono); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--amber); color:#0f1a08; border:none; padding:10px 18px;
    border-radius:5px; cursor:pointer; font-weight:600;
    transition:transform .15s ease, background .2s ease;
  }
  .btn:hover{background:#97d956; transform:translateY(-1px);}
  .btn.ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn.ghost:hover{color:var(--text); border-color:var(--teal);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}

  .quizresult{text-align:center; padding:40px 20px;}
  .quizresult .score{font-family:var(--mono); font-size:52px; color:var(--amber); margin-bottom:6px;}
  .quizresult .label{color:var(--text-dim); font-size:13px; margin-bottom:22px;}

  /* ---------- Flashcards ---------- */
  .cardsgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px;}
  .flash{perspective:1000px; height:130px; cursor:pointer;}
  .flash-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flash.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:12px;
  }
  .flash-front{background:var(--panel-raised);}
  .flash-front .acr{font-family:var(--mono); font-size:20px; color:var(--teal); font-weight:600;}
  .flash-front .hint{font-size:10.5px; color:var(--text-dim); margin-top:8px; text-transform:uppercase; letter-spacing:.05em;}
  .flash-back{background:var(--teal-dim); transform:rotateY(180deg);}
  .flash-back .full{font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px;}
  .flash-back .desc{font-size:11.5px; color:var(--text-dim); line-height:1.4;}

  /* ---------- Overview / dashboard ---------- */
  .ovwgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:10px;}
  .ovwcard{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 18px; cursor:pointer; transition:transform .2s ease, border-color .2s ease;}
  .ovwcard:hover{border-color:var(--teal); transform:translateY(-3px);}
  .ovwcard .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .ovwcard .t-title{font-size:14px; font-weight:600;}
  .ovwcard .t-sub{font-size:12px; color:var(--text-dim); line-height:1.4;}
  .ovwcard .t-status{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; color:var(--text-dim);}

  .barwrap{height:5px; background:var(--panel-raised); border-radius:3px; overflow:hidden; margin-top:20px;}
  .barfill{height:100%; background:linear-gradient(90deg, var(--teal), var(--amber)); transition:width .4s;}

  .diagram{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); line-height:1.9;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; white-space:pre; overflow-x:auto; margin-bottom:14px;
  }
  .diagram .hl{color:var(--amber);}
  .diagram .hl2{color:var(--teal);}

  .fig{margin:12px 0 4px 0;}
  .fig img{width:100%; max-width:420px; display:block; border-radius:6px; border:1px solid var(--line); background:#f5f3ee; margin:0 auto;}
  .fig figcaption{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:6px; text-align:center;}

  .resetrow{margin-top:26px; padding-top:16px; border-top:1px solid var(--line);}
</style>
</head>

  return `<div class="fig"><img src="${IMAGES[key]}" alt="${caption}" loading="lazy"><figcaption>${caption}</figcaption></div>`;
}
let accId = 0;
function acc(summary, bodyHtml, open){
  accId++;
  return `<details class="acc" ${open?'open':''}><summary>${summary}<span class="chev">▸</span></summary><div class="accbody">${bodyHtml}</div></details>`;
}

function animateIn(container){
  const items = container.querySelectorAll('.modhead, .card, details.acc, .fig, .ovwcard, .qcard, .diagram, .barwrap, .flash');
  items.forEach((el,i)=>{
    el.classList.add('reveal');
    el.style.transitionDelay = Math.min(i*70,560)+'ms';
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    items.forEach(el=>el.classList.add('in'));
  }));
}

      <p>El agua desionizada se usa precisamente porque, al no tener iones disueltos, es un mal conductor eléctrico — lo que permite hacerla circular en contacto cercano con componentes de potencia energizados sin riesgo de cortocircuito.</p>

      <p>Al cerrar el MCB, el panel CDP312 indica <strong>CHARGING</strong> mientras el DC-Link se carga; el proceso dura solo unos segundos. Al finalizar, el ACS1000 queda listo para partir.</p>

  `,
  quiz:[
    {q:'Antes de presionar "MAIN CIRCUIT ONLINE", ¿en qué posición debe estar el switch de puesta a tierra?', options:['Cerrado (closed)','Abierto (open)','En posición intermedia','No importa la posición'], answer:1, explain:'El switch de puesta a tierra debe estar en OPEN antes de cerrar el MCB.'},

    {q:'Si el switch se niega a moverse aun con la luz "unlocked" encendida, ¿qué se sospecha?', options:['Fuga en el sistema de agua','Problema en el solenoide o el pin de bloqueo','Falla del ventilador','Sobrevoltaje DC'], answer:1, explain:'Ese síntoma apunta a un problema mecánico o eléctrico en el solenoide o el pin de bloqueo.'},

/* ============================================================
   ESTADO + PERSISTENCIA (localStorage)
   ============================================================ */
const STORAGE_KEY = 'acs1000_training_progress_v1';

const state = {
  currentId: 'overview',
  view: 'learn',
  quizProgress: {},
  quizIndex: {},
};
MODULES.forEach(m=>{
  if(m.quiz){ state.quizProgress[m.id] = {answered:new Array(m.quiz.length).fill(null)}; state.quizIndex[m.id]=0; }
});

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    MODULES.forEach(m=>{
      if(!m.quiz) return;
      const savedAnswers = saved && saved[m.id];
      if(Array.isArray(savedAnswers) && savedAnswers.length === m.quiz.length){
        state.quizProgress[m.id].answered = savedAnswers;
      }
    });
  }catch(e){ console.warn('No se pudo cargar el progreso guardado:', e); }
}
function saveProgress(){
  try{
    const data = {};
    MODULES.forEach(m=>{ if(m.quiz) data[m.id] = state.quizProgress[m.id].answered; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){ console.warn('No se pudo guardar el progreso:', e); }
}
function resetAllProgress(){
  MODULES.forEach(m=>{
    if(!m.quiz) return;
    state.quizProgress[m.id].answered = new Array(m.quiz.length).fill(null);
    state.quizIndex[m.id] = 0;
  });
  saveProgress();
  render();
}
loadProgress();

/* ============================================================
   RENDER: SIDEBAR
   ============================================================ */
function ledStateFor(m){
  if(m.isOverview) return '';
  const p = state.quizProgress[m.id];
  if(!p) return '';
  const answeredCount = p.answered.filter(a=>a!==null).length;
  if(answeredCount===0) return '';
  if(answeredCount < m.quiz.length) return 'partial';
  return 'done';
}
let sidebarAnimated = false;
function renderSidebar(){
  const ul = document.getElementById('navlist');
  ul.innerHTML='';
  MODULES.forEach((m,i)=>{
    const li = document.createElement('li');
    li.className = 'navitem' + (state.currentId===m.id ? ' active':'');
    if(!sidebarAnimated){ li.style.animation = `slideInLeft .45s cubic-bezier(.2,.7,.3,1) ${i*35}ms both`; }
    const ledClass = ledStateFor(m);
    li.innerHTML = `
      ${m.isOverview ? '<span class="led"></span>' : `<span class="led ${ledClass}"></span>`}
      <span class="num">${m.isOverview? '—' : String(i).padStart(2,'0')}</span>
      <span class="label">${m.short}</span>
    `;
    li.onclick = ()=>{ state.currentId = m.id; state.view='learn'; render(); window.scrollTo(0,0); };
    ul.appendChild(li);
  });
  sidebarAnimated = true;
}

/* ============================================================
   RENDER: OVERVIEW
   ============================================================ */
function renderOverview(){
  const teachable = MODULES.filter(m=>!m.isOverview);
  const totalQ = teachable.reduce((s,m)=>s+m.quiz.length,0);
  const answeredQ = teachable.reduce((s,m)=>s+state.quizProgress[m.id].answered.filter(a=>a!==null).length,0);
  const pct = totalQ? Math.round(answeredQ/totalQ*100) : 0;

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="modhead">
      <div>
        <p class="eyebrow">Capacitación · ACS1000</p>
        <h2>Biblioteca de módulos</h2>
        <p class="sub">Capacitación técnica del ACS1000.</p>
      </div>
    </div>
    <div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div>
    <p style="font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin:8px 0 24px 0;">${answeredQ} / ${totalQ} preguntas respondidas · ${pct}% · tu avance se guarda automáticamente en este navegador</p>
    <div class="ovwgrid">
      ${teachable.map((m,i)=>{
        const p = state.quizProgress[m.id];
        const answered = p.answered.filter(a=>a!==null).length;
        const correct = p.answered.reduce((s,a)=> s + (a===true?1:0), 0);
        let status = 'sin iniciar';
        if(answered>0 && answered<m.quiz.length) status = `en curso · ${answered}/${m.quiz.length}`;
        if(answered===m.quiz.length) status = `completo · ${correct}/${m.quiz.length} correctas`;
        return `<div class="ovwcard" data-id="${m.id}">
          <div class="top"><span class="t-title">${String(i).padStart(2,'0')} · ${m.title}</span><span class="led ${ledStateFor(m)}"></span></div>
          <div class="t-sub">${m.sub}</div>
          <div class="t-status" style="margin-top:10px;">${status}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="resetrow">
      <button class="btn ghost" id="resetAllBtn">Borrar todo el progreso guardado</button>
    </div>
  `;
  const resetBtn = document.getElementById('resetAllBtn');
  if(resetBtn){
    resetBtn.onclick = ()=>{
      if(confirm('¿Borrar el progreso guardado de todos los módulos? Esta acción no se puede deshacer.')){
        resetAllProgress();
      }
    };
  }
  main.querySelectorAll('.ovwcard').forEach(el=>{
    el.onclick = ()=>{ state.currentId = el.dataset.id; state.view='learn'; render(); window.scrollTo(0,0); };
  });
  animateIn(main);
}

/* ============================================================
   RENDER: MODULE (learn / quiz)
   ============================================================ */
function renderModule(m){
  const main = document.getElementById('main');
  const hasCards = !!m.flashcards;
  main.innerHTML = `
    <div class="modhead">
      <div>
        <p class="eyebrow">${m.eyebrow}</p>
        <h2>${m.title}</h2>
        <p class="sub">${m.sub}</p>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.view==='learn'?'active':''}" data-v="learn">Aprender</div>
      <div class="tab ${state.view==='quiz'?'active':''}" data-v="quiz">Quiz (${m.quiz.length})</div>
    </div>
    <div id="modbody"></div>
  `;
  main.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ state.view = t.dataset.v; render(); };
  });
  const body = document.getElementById('modbody');
  if(state.view==='learn'){
    body.innerHTML = m.content;
    if(hasCards) renderFlashcards(m);
  } else if(state.view==='quiz'){
    renderQuiz(m, body);
  }
  animateIn(main);
}

function renderFlashcards(m){
  const grid = document.getElementById('flashgrid');
  if(!grid) return;
  grid.innerHTML = m.flashcards.map((f,i)=>`
    <div class="flash" data-i="${i}">
      <div class="flash-inner">
        <div class="flash-face flash-front"><div class="acr">${f.acr}</div><div class="hint">toca para revelar</div></div>
        <div class="flash-face flash-back"><div class="full">${f.full}</div><div class="desc">${f.desc}</div></div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.flash').forEach(el=>{
    el.onclick = ()=> el.classList.toggle('flipped');
  });
}

/* ---------- Quiz engine ---------- */
function renderQuiz(m, body){
  const progress = state.quizProgress[m.id];
  const total = m.quiz.length;
  const answeredAll = progress.answered.every(a=>a!==null);

  if(answeredAll){
    const correct = progress.answered.filter(a=>a===true).length;
    body.innerHTML = `
      <div class="qcard">
        <div class="quizresult">
          <div class="score">${correct}/${total}</div>
          <div class="label">respuestas correctas en este módulo</div>
          <button class="btn ghost" id="retryBtn">Reintentar quiz</button>
        </div>
      </div>
    `;
    document.getElementById('retryBtn').onclick = ()=>{
      progress.answered = new Array(total).fill(null);
      state.quizIndex[m.id]=0;
      saveProgress();
      render();
    };
    return;
  }

  let idx = state.quizIndex[m.id];
  if(progress.answered[idx]!==null){
    idx = progress.answered.findIndex(a=>a===null);
    state.quizIndex[m.id]=idx;
  }
  const q = m.quiz[idx];
  body.innerHTML = `
    <div class="qcounter">Pregunta ${idx+1} de ${total}</div>
    <div class="qcard">
      <p class="qtext">${q.q}</p>
      <div id="optlist">
        ${q.options.map((o,oi)=>`<div class="opt" data-oi="${oi}"><span class="bullet">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`).join('')}
      </div>
      <div class="explain" id="explainBox">${q.explain}</div>
      <div class="qnav">
        <span style="font-family:var(--mono); font-size:11px; color:var(--text-dim);">selecciona una opción</span>
        <button class="btn" id="nextBtn" disabled>Siguiente</button>
      </div>
    </div>
  `;
  let picked = false;
  document.querySelectorAll('#optlist .opt').forEach(el=>{
    el.onclick = ()=>{
      if(picked) return;
      picked = true;
      const oi = parseInt(el.dataset.oi);
      const isCorrect = oi===q.answer;
      progress.answered[idx] = isCorrect;
      saveProgress();
      document.querySelectorAll('#optlist .opt').forEach(o2=>{
        const oi2 = parseInt(o2.dataset.oi);
        if(oi2===q.answer) o2.classList.add('correct');
        else if(oi2===oi) o2.classList.add('wrong');
      });
      document.getElementById('explainBox').classList.add('show');
      const nb = document.getElementById('nextBtn');
      nb.disabled = false;
      nb.onclick = ()=>{
        state.quizIndex[m.id] = idx+1 < total ? idx+1 : idx;
        render();
      };
      renderSidebar();
    };
  });
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  renderSidebar();
  const m = MODULES.find(mm=>mm.id===state.currentId);
  if(m.isOverview) renderOverview();
  else renderModule(m);
}

render();
</script>
